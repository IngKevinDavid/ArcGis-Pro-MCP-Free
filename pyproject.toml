[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcgis-lab-mcp"
version = "0.2.3"
description = "Native ArcGIS Pro toolbox dialogs and experiment screenshots"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["mcp>=1.28.1,<2", "jsonschema>=4.26,<5", "windows-capture==2.0.1", "pywin32>=312", "psutil>=7,<8"]

[project.scripts]
arcgis-lab-mcp = "arcgis_lab_mcp.server:main"

[tool.setuptools.packages.find]
where = ["py-server"]

[tool.setuptools.package-data]
arcgis_lab_mcp = ["*.json"]
